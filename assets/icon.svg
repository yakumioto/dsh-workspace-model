<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">DSH Workspace Model</title>
  <desc id="desc">A white workspace folder framing a luminous AI model cube, on an indigo to violet rounded square.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#263DAD"/>
      <stop offset=".55" stop-color="#5544C9"/>
      <stop offset="1" stop-color="#8D55E3"/>
    </linearGradient>
    <linearGradient id="cube" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#BDF8FF"/>
      <stop offset="1" stop-color="#D5CBFF"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="54" fill="url(#bg)"/>
  <!-- Workspace folder, spacious and readable at 32px -->
  <path d="M43 92V76c0-10 8-18 18-18h45l19 19h70c10 0 18 8 18 18v83c0 11-9 20-20 20H63c-11 0-20-9-20-20V92Z" fill="#FFF" fill-opacity=".13" stroke="#FFF" stroke-width="10" stroke-linejoin="round"/>
  <!-- Distinct AI model represented as a dimensional cube -->
  <path d="m128 104 35 20-35 20-35-20 35-20Z" fill="url(#cube)"/>
  <path d="m93 124 35 20v40l-35-20v-40Z" fill="#DCEBFF"/>
  <path d="m163 124-35 20v40l35-20v-40Z" fill="#A5B8FF"/>
  <path d="m128 144 0 40M93 124l35 20 35-20" fill="none" stroke="#4E51B9" stroke-opacity=".55" stroke-width="3" stroke-linejoin="round"/>
  <!-- Model selection indicator -->
  <circle cx="193" cy="188" r="24" fill="#FFFFFF"/>
  <path d="m182 187 8 8 15-16" fill="none" stroke="#6551CE" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
